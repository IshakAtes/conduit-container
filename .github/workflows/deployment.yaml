name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  OWNER: ishakates
  REPO: conduit

jobs:

  # --------------------------------------------------------
  # Job A: Checkout main repo inkl. Submodule
  # --------------------------------------------------------
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: true  # <-- lädt Backend & Frontend automatisch

      # Optional: Environment file kopieren
      - name: Copy environment file
        run: cp example.env .env


  # --------------------------------------------------------
  # Job B: Build backend image
  # --------------------------------------------------------
  build-backend-image:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile.backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-backend:latest


  # --------------------------------------------------------
  # Job C: Build frontend image
  # --------------------------------------------------------
  build-frontend-image:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile.frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-frontend:latest



  # --------------------------------------------------------
  # Job D: Push backend image
  # --------------------------------------------------------
  push-backend-image:
    runs-on: ubuntu-latest
    needs: build-backend-image
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        run: docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-backend:latest


  # --------------------------------------------------------
  # Job E: Push frontend image
  # --------------------------------------------------------
  push-frontend-image:
    runs-on: ubuntu-latest
    needs: build-frontend-image
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push frontend image
        run: docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-frontend:latest


  # --------------------------------------------------------
  # Job F: Sign images (cosign)
  # --------------------------------------------------------
  sign-images:
    runs-on: ubuntu-latest
    needs:
      - push-backend-image
      - push-frontend-image
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Sign backend image
        run: echo "${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-backend:latest" | xargs cosign sign --yes

      - name: Sign frontend image
        run: echo "${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-frontend:latest" | xargs cosign sign --yes


  # --------------------------------------------------------
  # Job G: Deploy to server
  # --------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: sign-images
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SECRET_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            echo "Pulling updated images..."
            docker pull ${{ env.REGISTRY }}/ishakates/conduit-backend:latest
            docker pull ${{ env.REGISTRY }}/ishakates/conduit-frontend:latest
            docker compose down
            docker compose up -d
