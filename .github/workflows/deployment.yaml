name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # --------------------------------------------------------
  # Job A: Checkout main, backend & frontend repositories
  # --------------------------------------------------------
  checkout:
    runs-on: ubuntu-latest
    steps:
      # Checkout main repo (conduit-container) including submodules (Backend + Frontend)
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: IshakAtes/conduit-backend
          path: conduit-backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: IshakAtes/conduit-frontend
          path: conduit-frontend
          token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Copy environment file
      #   run: cp example.env .env


  # --------------------------------------------------------
  # Job B: Build backend image
  # --------------------------------------------------------
  build-backend-image:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend (no push)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile.backend
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      backend_tag: ${{ steps.meta.outputs.tags }}
      backend_digest: ${{ steps.build.outputs.digest }}


  # --------------------------------------------------------
  # Job C: Build frontend image
  # --------------------------------------------------------
  build-frontend-image:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend (no push)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile.frontend
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      frontend_tag: ${{ steps.meta.outputs.tags }}
      frontend_digest: ${{ steps.build.outputs.digest }}


  # --------------------------------------------------------
  # Job D: Push backend image
  # --------------------------------------------------------
  push-backend-image:
    runs-on: ubuntu-latest
    needs: build-backend-image
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        run: |
          docker pull $(echo "${{ needs.build-backend-image.outputs.backend_tag }}" | head -n 1)
          docker push $(echo "${{ needs.build-backend-image.outputs.backend_tag }}" | head -n 1)


  # --------------------------------------------------------
  # Job E: Push frontend image
  # --------------------------------------------------------
  push-frontend-image:
    runs-on: ubuntu-latest
    needs: build-frontend-image
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push frontend image
        run: |
          docker pull $(echo "${{ needs.build-frontend-image.outputs.frontend_tag }}" | head -n 1)
          docker push $(echo "${{ needs.build-frontend-image.outputs.frontend_tag }}" | head -n 1)


  # --------------------------------------------------------
  # Job F: Sign images (cosign)
  # --------------------------------------------------------
  sign-images:
    runs-on: ubuntu-latest
    needs:
      - push-backend-image
      - push-frontend-image

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Sign backend image
        run: echo "${{ needs.build-backend-image.outputs.backend_tag }}" | xargs cosign sign --yes

      - name: Sign frontend image
        run: echo "${{ needs.build-frontend-image.outputs.frontend_tag }}" | xargs cosign sign --yes


  # --------------------------------------------------------
  # Job G: Deploy to server
  # --------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: sign-images
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SECRET_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            echo "Pulling updated images..."
            docker pull ghcr.io/ishakates/conduit-container-backend:latest
            docker pull ghcr.io/ishakates/conduit-container-frontend:latest
            docker compose down
            docker compose up -d
