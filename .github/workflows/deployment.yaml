name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  OWNER: ishakates
  REPO: conduit

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # --------------------------------------------------------
  # Job A: Checkout main repo inkl. Submodule
  # --------------------------------------------------------
  # checkout:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout main repo with submodules
  #       uses: actions/checkout@v4
  #       with:
  #         submodules: true  # <-- lädt Backend & Frontend automatisch


  # --------------------------------------------------------
  # Job B: Build and Push backend image in ghcr.io
  # --------------------------------------------------------
  build-backend-image:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-backend:latest


  # --------------------------------------------------------
  # Job C: Build and Push frontend image in ghcr.io
  # --------------------------------------------------------
  build-frontend-image:
    runs-on: ubuntu-latest
    needs: build-backend-image
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # Generate environment.ts in Frontend
      # --------------------------------------------------------
      - name: Generate Angular environment.ts
        run: |
          mkdir -p conduit-frontend/src/environments
          echo "export const environment = {" > conduit-frontend/src/environments/environment.ts
          echo "  production: true," >> conduit-frontend/src/environments/environment.ts
          echo "  API_URL: '${{ secrets.API_URL }}'," >> conduit-frontend/src/environments/environment.ts
          echo "};" >> conduit-frontend/src/environments/environment.ts

      - name: Build & Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-frontend:latest


  # --------------------------------------------------------
  # Job D: Sign images (cosign)
  # --------------------------------------------------------
  sign-images:
    runs-on: ubuntu-latest
    needs:
      - build-backend-image
      - build-frontend-image
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign backend image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-backend:latest

      - name: Sign frontend image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-frontend:latest


  # --------------------------------------------------------
  # Job E: Copy docker-compose.workflow.yaml to server
  # --------------------------------------------------------
  copy-compose-to-server:
    runs-on: ubuntu-latest
    needs: sign-images
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SECRET_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          source: docker-compose.workflow.yaml
          target: /home/${{ secrets.SSH_USER }}/conduit-container


  # --------------------------------------------------------
  # Job F: Deploy to server
  # --------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: copy-compose-to-server
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SECRET_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /$HOME/conduit-container

            echo "${{ secrets.ENV_FILE }}" > .env

            docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/conduit-backend:latest
            docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/conduit-frontend:latest

            docker compose -f docker-compose.workflow.yaml up -d --remove-orphans